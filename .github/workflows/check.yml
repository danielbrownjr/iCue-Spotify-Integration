name: Validate
on:
  pull_request:
  workflow_dispatch:

jobs:
  node-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Validate iCUE widget
        run: |
          npm install -g icuewidget-cli
          icuewidget validate widget

  windows-dpapi:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Node tests including native Windows DPAPI roundtrip
        run: npm test
      - name: Validate Windows startup scripts and synthetic hidden launcher
        shell: pwsh
        run: |
          foreach ($relative in @('scripts/companion-autostart.ps1', 'scripts/start-companion-hidden.ps1', 'test/hidden-launcher.test.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $relative), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell parse failure in " + $relative + ": " + ($errors | Out-String)) }
          }
          & (Join-Path $PWD 'test/hidden-launcher.test.ps1')
