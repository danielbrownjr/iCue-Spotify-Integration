name: Validate
on:
  pull_request:
  workflow_dispatch:

jobs:
  node-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Validate iCUE widget
        run: |
          npm install -g icuewidget-cli
          icuewidget validate widget
      - name: Build installable iCUE widget preview
        run: |
          icuewidget package widget --output spotify-queue-0.1.4.icuewidget
          test -s spotify-queue-0.1.4.icuewidget
          unzip -t spotify-queue-0.1.4.icuewidget
          unzip -Z1 spotify-queue-0.1.4.icuewidget | grep -Eq '(^|/)manifest\.json$'
          unzip -Z1 spotify-queue-0.1.4.icuewidget | grep -Eq '(^|/)index\.html$'
          sha256sum spotify-queue-0.1.4.icuewidget
      - name: Save hardware-test widget package
        uses: actions/upload-artifact@v4
        with:
          name: spotify-edge-widget-v0.1.4
          path: spotify-queue-0.1.4.icuewidget
          if-no-files-found: error
          retention-days: 14

  windows-dpapi:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Node tests including native Windows DPAPI roundtrip
        run: npm test
      - name: Validate Windows startup scripts and synthetic hidden launcher
        shell: pwsh
        run: |
          foreach ($relative in @('scripts/companion-autostart.ps1', 'scripts/start-companion-hidden.ps1', 'scripts/build-hidden-launcher.ps1', 'scripts/installation-safety.ps1', 'test/hidden-launcher.test.ps1', 'test/installation-safety.test.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $relative), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell parse failure in " + $relative + ": " + ($errors | Out-String)) }
          }
          & (Join-Path $PWD 'test/hidden-launcher.test.ps1')
          & (Join-Path $PWD 'test/installation-safety.test.ps1')
