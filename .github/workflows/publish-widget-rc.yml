name: Publish tested Spotify widget RC v0.1.4-rc.1

on:
  push:
    branches:
      - feat/edge-transport-button-icons
    paths:
      - .github/workflows/publish-widget-rc.yml

permissions:
  contents: read

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Confirm tested widget source is unchanged
        shell: bash
        run: |
          git cat-file -e "8bd60e7be0193a6a26b05cd9648378722b537e1c^{commit}"
          git diff --exit-code 8bd60e7be0193a6a26b05cd9648378722b537e1c "$GITHUB_SHA" -- widget package.json
          node -e "const m=require('./widget/manifest.json');if(m.version!=='0.1.4'||m.id!=='com.danielbrown.icuespotify')process.exit(1)"
      - name: Validate source and Node tests
        run: |
          npm run check
          npm test
      - name: Validate official iCUE widget
        run: |
          npm install -g icuewidget-cli
          icuewidget validate widget

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run native Windows tests
        run: npm test
      - name: Validate Windows scripts and synthetic fixtures
        shell: pwsh
        run: |
          foreach ($relative in @('scripts/companion-autostart.ps1', 'scripts/start-companion-hidden.ps1', 'scripts/build-hidden-launcher.ps1', 'scripts/installation-safety.ps1', 'test/hidden-launcher.test.ps1', 'test/installation-safety.test.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $relative), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ("PowerShell parse failure in " + $relative + ": " + ($errors | Out-String)) }
          }
          & (Join-Path $PWD 'test/hidden-launcher.test.ps1')
          & (Join-Path $PWD 'test/installation-safety.test.ps1')

  publish-rc:
    if: github.repository == 'danielbrownjr/iCue-Spotify-Integration' && github.ref == 'refs/heads/feat/edge-transport-button-icons'
    needs: [verify-linux, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.4-rc.1
      SOURCE_SHA: 8bd60e7be0193a6a26b05cd9648378722b537e1c
      PACKAGE_SHA256: ab5e429cb1e141555b324207a7b4488c7be7db94dbad250b702a0a932758f63b
      ORIGINAL_RUN: "39352884304"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover byte-for-byte hardware-tested iCUE package
        shell: bash
        run: |
          mkdir -p release-preview
          gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" --name spotify-edge-widget-v0.1.4 --dir release-preview
          test -s release-preview/spotify-queue-0.1.4.icuewidget
          printf '%s  %s\n' "$PACKAGE_SHA256" release-preview/spotify-queue-0.1.4.icuewidget | sha256sum --check -
          unzip -t release-preview/spotify-queue-0.1.4.icuewidget
          unzip -Z1 release-preview/spotify-queue-0.1.4.icuewidget | grep -Eq '(^|/)manifest\.json$'
          unzip -Z1 release-preview/spotify-queue-0.1.4.icuewidget | grep -Eq '(^|/)index\.html$'
      - name: Publish immutable prerelease without modifying main
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Refusing to overwrite existing tag $TAG"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release $TAG"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## Spotify Queue Dashboard v0.1.4-rc.1

          Release candidate for the Corsair XENEON EDGE Spotify dashboard, produced from PR #7. Not a stable/final release.

          ### What's changed
          - Replaced platform-dependent skip/transport Unicode glyphs with consistent inline SVG icons.
          - Correct vector Play/Pause artwork instead of Roman-numeral pause characters.
          - Improved touch targets, focus indication, selected Shuffle/Repeat appearance, and orange primary playback control.
          - No changes to Spotify OAuth, queue-jump logic, the local Node companion, or Windows Scheduled Task.

          ### Verification
          - The user reported successful operation of the v0.1.4 widget on their physical EDGE.
          - CI validated the official widget and 46 Windows tests; the release workflow also validates Linux and Windows before publishing.
          - The attached installable .icuewidget is byte-identical to the previously validated and user-tested CI artifact.
          - Widget manifest version is 0.1.4; the GitHub prerelease tag is v0.1.4-rc.1.
          - Packaged widget SHA-256: `ab5e429cb1e141555b324207a7b4488c7be7db94dbad250b702a0a932758f63b`.

          ### Installation and rollback
          Import the attached .icuewidget into iCUE and keep a backup of the previously working v0.1.3 package. Preserve the existing widget pairing key privately. No companion upgrade is needed.

          Source: PR #7, validated package commit `8bd60e7be0193a6a26b05cd9648378722b537e1c`.
          EOF
          gh release create "$TAG" release-preview/spotify-queue-0.1.4.icuewidget \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Spotify Queue Dashboard v0.1.4-rc.1" \
            --notes-file release-notes.md \
            --prerelease --latest=false
